  { id: 3, name: "当たるんです3", gates: 3, p: 1 / 20, odds: "1/20", real: "1/512", prize: 179200 },

];

const TIERS = {

  blue:   { label: "青",  c: "#4da3ff", text: "#4da3ff" },

// 重み付き抽選
function pick(table) {
  const sum = table.reduce((a, [, w]) => a + w, 0);
  let r = Math.random() * sum;
  for (const [k, w] of table) { r -= w; if (r <= 0) return k; }
  return table[table.length - 1][0];
}

// ============ シナリオ生成(結果先決め) ============
function rollScenario(m) {
  const n = m.gates;
  const win = Math.random() < m.p;

  if (win) {
    const type = n === 1
      ? pick([["normal", 90], ["premium", 10]])
      : pick([["normal", 70], ["revival", 20], ["premium", 10]]);
    const aura =
      type === "premium" ? "rainbow" :
      type === "revival" ? pick([["white", 40], ["blue", 40], ["green", 20]]) :
      pick([["blue", 10], ["green", 20], ["red", 35], ["gold", 25], ["rainbow", 10]]);
    const revivalGate = type === "revival" ? 2 + Math.floor(Math.random() * (n - 1)) : 0;
    return { win, type, aura, revivalGate, failGate: 0, fakeRevival: false };
  }

  // ハズレ:脱落箱の分布(深追いしやすいフラット寄り、最終箱の惜敗は2倍)
  const weights = [];
  for (let k = 1; k <= n; k++) {
    let w = Math.pow(0.55, k - 1);
    if (k === n && n >= 2) w *= 2;
    weights.push([k, w]);
  }
  const failGate = pick(weights);
  const fakeRevival = n >= 2 && failGate === n && Math.random() < 0.35;
  const aura = pick([["white", 55], ["blue", 30], ["green", 10], ["red", 5]]);
  return { win, type: "lose", aura, revivalGate: 0, failGate, fakeRevival };
}

// ============ サウンド(WebAudio 簡易シンセ) ============
function makeSound() {
  let ctx = null;
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  const tone = (f, t, dur, type = "square", vol = 0.08, slide = 0) => {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  };
  const noise = (t, dur, vol = 0.25, freq = 600) => {
    const c = ac(); if (!c) return;
    const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  };
  return {
    unlock: () => ac(),
    charge: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      for (let i = 0; i < 8; i++) tone(300 + i * 90, t + i * 0.09, 0.08, "square", 0.05); },
    auraSet: (tier) => { const c = ac(); if (!c) return; const t = c.currentTime;
      if (tier === "rainbow") { [880, 1108, 1318, 1760].forEach((f, i) => tone(f, t + i * 0.07, 0.4, "triangle", 0.1)); }
      else tone(660, t, 0.25, "triangle", 0.09, 990); },
    dash: () => { const c = ac(); if (!c) return; noise(c.currentTime, 0.12, 0.08, 2500); },
    breakHit: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      noise(t, 0.3, 0.3, 900); tone(140, t, 0.25, "sawtooth", 0.12, 60); },
    bounce: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      tone(220, t, 0.18, "square", 0.1, 110); noise(t, 0.15, 0.12, 500); },
    pass: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      [784, 1046, 1568].forEach((f, i) => tone(f, t + i * 0.08, 0.28, "triangle", 0.1)); },
    dark: () => { const c = ac(); if (!c) return; tone(80, c.currentTime, 0.9, "sine", 0.12, 50); },
    revive: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      tone(330, t, 0.7, "sawtooth", 0.1, 1320); [659, 880, 1318].forEach((f, i) => tone(f, t + 0.3 + i * 0.08, 0.35, "triangle", 0.09)); },
    win: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * 0.11, 0.3, "square", 0.09));
      noise(t + 0.7, 0.5, 0.15, 1500); },
    lose: () => { const c = ac(); if (!c) return; const t = c.currentTime;
      tone(330, t, 0.3, "triangle", 0.1, 311); tone(294, t + 0.3, 0.6, "triangle", 0.1, 220); },
  };
}
const SND = makeSound();

// ============ メイン ============
function App() {
  const [mode, setMode] = useState(MODES[2]); // デフォは当たるんです4
  const [busy, setBusy] = useState(false);
  const [auto, setAuto] = useState(false);
  const [mute, setMute] = useState(false);

  const [aura, setAura] = useState(null);          // 期待度カラー
  const [auraFlicker, setAuraFlicker] = useState(false);
  const [gateNo, setGateNo] = useState(0);          // いま挑戦中の門 (1-index, 0=なし)
  const [gateStatus, setGateStatus] = useState("sealed");
  const [progress, setProgress] = useState([]);     // 'pending'|'now'|'pass'|'fail'
  const [charPose, setCharPose] = useState("idle"); // idle|charge|dash|bounce|win|lose|revive
  const [fx, setFx] = useState({ flash: false, shake: false, dark: false, clouds: false });
  const [result, setResult] = useState(null);       // {win, text, sub}
  const [stats, setStats] = useState({ tries: 0, wins: 0 });
  const [fast, setFast] = useState(false);
  const [burst, setBurst] = useState(false);
  const [breakText, setBreakText] = useState(null);
  const [pending, setPending] = useState(null); // {sc, n, next} 次の箱の押下待ち

  const runId = useRef(0);
  const skipRef = useRef(false);
  const autoRef = useRef(false);
  const muteRef = useRef(false);
  const speedRef = useRef(1);
  useEffect(() => { autoRef.current = auto; }, [auto]);
  const statsRef = useRef({ tries: 0, wins: 0 });
  useEffect(() => { statsRef.current = stats; }, [stats]);
  useEffect(() => { muteRef.current = mute; }, [mute]);

  const seq = chestSeq(mode.gates);

  const snd = (name) => { if (!muteRef.current) { try { SND[name](); } catch (e) {} } };

  const sleep = useCallback((ms) => {
    const id = runId.current;
    return new Promise((res, rej) => {
      setTimeout(() => {
        if (runId.current !== id) return rej("cancel");
        if (skipRef.current) return rej("skip");
        res();
      }, ms * speedRef.current);
    });
  }, []);

  const resetStage = (n) => {
    setAura(null); setAuraFlicker(false);
    setGateNo(0); setGateStatus("sealed");
    setProgress(Array(n).fill("pending"));
    setCharPose("idle");
    setFx({ flash: false, shake: false, dark: false, clouds: false });
    setBurst(false); setBreakText(null);
    setPending(null);
    setResult(null);
  };

  // 突破演出:オート中もここだけ等速に戻す(dramatic=true時)
  const breakGate = async (k, n, dramatic = true) => {
    const keep = speedRef.current;
    if (dramatic && keep < 1) { speedRef.current = 1; setFast(false); }
    try {
      // ヒットストップ
      setFx((f) => ({ ...f, flash: true }));
      await sleep(90);
      setFx((f) => ({ ...f, flash: false }));
      // 粉砕
      snd("breakHit");
      setGateStatus("broken");
      setBurst(true);
      setCharPose("smash");
      setFx((f) => ({ ...f, shake: true }));
      setProgress((p) => p.map((s, i) => (i === k - 1 ? "pass" : s)));
      await sleep(430);
      setFx((f) => ({ ...f, shake: false }));
      await sleep(220);
      setBurst(false);
      // 余韻:突破コール
      if (dramatic) {
        snd("pass");
        setBreakText(`${CHEST_MAT[seq[k - 1]].label} 粉砕!!`);
        await sleep(k === n ? 1050 : 820);
        setBreakText(null);
      }
      setCharPose("idle");
      await sleep(300);
    } finally {
      speedRef.current = keep;
      setFast(keep < 1);
    }
    if (k < n) {
      setGateNo(k + 1);
      setGateStatus("sealed");
      setProgress((p) => p.map((s, i) => (i === k ? "now" : s)));
      await sleep(380);
    }
  };

  const finishWin = (sc) => {
    setCharPose("win");
    setFx((f) => ({ ...f, dark: false, clouds: sc.type === "premium" }));
    const t = statsRef.current.tries;
    setResult({
      win: true,
      text: "大当たり",
      prize: `${mode.prize.toLocaleString()}円当選${mode.id === 4 ? "!!" : "!"}`,
      sub:
        (sc.type === "premium" ? "プレミア!虹雲降臨 〜 " : sc.type === "revival" ? "復活!! 〜 " : "") +
        `${t}回目の挑戦で ${mode.odds} 突破!!`,
    });
    snd("win");
  };

  const finishLose = (sc, n) => {
    setCharPose("loseAtBox"); // その場に崩れたまま(戻るのは次の挑戦時)
    setFx((f) => ({ ...f, dark: false }));
    setResult({
      win: false,
      text: "残念…",
      sub: sc.fakeRevival ? "復活ならず……不発" : `${CHEST_MAT[seq[sc.failGate - 1]].label}に阻まれた(${sc.failGate}/${n}箱目)`,
    });
    snd("lose");
  };

  // ラン終了処理(当選時はカウンターをリセット)
  const endWin = (sc) => {
    finishWin(sc);
    setPending(null);
    setBusy(false);
    setStats((st) => ({ tries: 0, wins: st.wins }));
    if (autoRef.current) {
      const id = runId.current;
      setTimeout(() => { if (runId.current === id && autoRef.current) newRun(); }, 3000);
    }
  };
  const endLose = (sc, n) => {
    finishLose(sc, n);
    setPending(null);
    setBusy(false);
    if (autoRef.current) {
      const id = runId.current;
      setTimeout(() => { if (runId.current === id && autoRef.current) newRun(); }, 700 * speedRef.current);
    }
  };

  // スキップ時:最終結果を即描画
  const applyFinal = (sc, n) => {
    setAuraFlicker(false);
    setFx({ flash: false, shake: false, dark: false, clouds: sc.win && sc.type === "premium" });
    setBurst(false); setBreakText(null);
    if (sc.win) {
      setAura(sc.type === "revival" || sc.type === "premium" ? "rainbow" : sc.aura);
      setProgress(Array(n).fill("pass"));
      setGateNo(n); setGateStatus("broken");
      finishWin(sc);
      setStats((st) => ({ tries: 0, wins: st.wins }));
    } else {
      setAura(sc.aura);
      setProgress(Array(n).fill("pending").map((st, i) =>
        i < sc.failGate - 1 ? "pass" : i === sc.failGate - 1 ? "fail" : "pending"));
      setGateNo(sc.failGate); setGateStatus("sealed");
      finishLose(sc, n);
    }
    setPending(null);
    setBusy(false);
    if (autoRef.current) {
      const id = runId.current;
      setTimeout(() => { if (runId.current === id && autoRef.current) newRun(); }, sc.win ? 2500 : 600);
    }
  };

  // 1箱ぶんの挑戦(=ボタン1押下)。オート時のみ自動続行。
  const attempt = async (k, sc, n) => {
    speedRef.current = autoRef.current ? 0.35 : 1;
    setFast(autoRef.current);
    setBusy(true);
    setPending(null);
    const id = runId.current;
    try {
      setCharPose("dash");
      snd("dash");
      await sleep(480);

      const isFail = !sc.win && sc.failGate === k;
      const isRevivalFail = sc.win && sc.type === "revival" && sc.revivalGate === k;

      if (isFail || isRevivalFail) {
        // 弾かれてその場に崩れる(元の位置には戻らない)
        snd("bounce");
        setCharPose("deflect");
        setFx((f) => ({ ...f, shake: true }));
        await sleep(180);
        setFx((f) => ({ ...f, shake: false }));
        setProgress((p) => p.map((st, i) => (i === k - 1 ? "fail" : st)));
        await sleep(620);

        if (isRevivalFail || sc.fakeRevival) {
          snd("dark");
          setFx((f) => ({ ...f, dark: true }));
          setAura("white");
          await sleep(1300);

          if (isRevivalFail) {
            // 真・復活(この一押しの中で完結する特殊演出)
            snd("revive");
            setAura("rainbow");
            setCharPose("revive");
            await sleep(750);
            setFx((f) => ({ ...f, dark: false }));
            setProgress((p) => p.map((st, i) => (i === k - 1 ? "now" : st)));
            await sleep(350);
            const keep = speedRef.current;
            speedRef.current = keep * 0.45;
            for (let j = k; j <= n; j++) {
              if (j > k) {
                setGateNo(j); setGateStatus("sealed");
                setProgress((p) => p.map((st, i) => (i === j - 1 ? "now" : st)));
                await sleep(300);
              }
              setCharPose("dash"); snd("dash");
              await sleep(420);
              await breakGate(j, n, j === n);
            }
            speedRef.current = keep;
            endWin(sc);
            return;
          }
          // 偽復活 → 不発
          await sleep(500);
          endLose(sc, n);
          return;
        }
        await sleep(250);
        endLose(sc, n);
        return;
      }

      // 突破
      await breakGate(k, n);
      if (k === n) { endWin(sc); return; }

      // 次の箱:手動は押下待ち、オートは自動続行
      const ctx = { sc, n, next: k + 1 };
      setBusy(false);
      setPending(ctx);
      if (autoRef.current) {
        setTimeout(() => { if (runId.current === id && autoRef.current) attempt(ctx.next, sc, n); }, 380 * speedRef.current);
      }
    } catch (e) {
      if (e === "skip") { skipRef.current = false; applyFinal(sc, n); }
    } finally {
      skipRef.current = false;
    }
  };

  // 新しいラン:抽選確定 → 溜め → 1箱目へ
  const newRun = async () => {
    if (busy) return;
    SND.unlock();
    const n = mode.gates;
    const sc = rollScenario(mode);
    runId.current += 1;
    skipRef.current = false;
    speedRef.current = autoRef.current ? 0.35 : 1;
    setFast(autoRef.current);
    setBusy(true);
    setStats((st) => ({ tries: st.tries + 1, wins: st.wins + (sc.win ? 1 : 0) }));
    resetStage(n);

    try {
      await sleep(380); // 立ち位置へ戻る間

      // 溜め:オーラ抽選
      setCharPose("charge");
      setAuraFlicker(true);
      snd("charge");
      const flickSeq = ["blue", "white", "green", "red", "white", "gold", "blue"];
      for (const t of flickSeq) { setAura(t); await sleep(110); }
      setAuraFlicker(false);
      const startAura = sc.type === "premium" ? "rainbow" : sc.aura;
      setAura(startAura);
      snd("auraSet");
      await sleep(startAura === "rainbow" ? 900 : 600);

      // プレミア:虹雲降臨で全箱開放(特殊演出のため自動進行)
      if (sc.type === "premium") {
        setFx((f) => ({ ...f, clouds: true }));
        await sleep(900);
        for (let k = 1; k <= n; k++) {
          setGateNo(k); setGateStatus("sealed");
          setProgress((p) => p.map((st, i) => (i === k - 1 ? "now" : st)));
          await sleep(180);
          snd("breakHit");
          setGateStatus("broken");
          setBurst(true);
          setProgress((p) => p.map((st, i) => (i === k - 1 ? "pass" : st)));
          await sleep(260);
          setBurst(false);
        }
        endWin(sc);
        return;
      }

      // 1箱目の用意 → 挑戦
      setGateNo(1);
      setProgress((p) => p.map((st, i) => (i === 0 ? "now" : st)));
      await sleep(420);
      await attempt(1, sc, n);
    } catch (e) {
      if (e === "skip") { skipRef.current = false; applyFinal(sc, n); }
    }
  };

  const onMain = () => {
    if (busy) return;
    if (pending) attempt(pending.next, pending.sc, pending.n);
    else newRun();
  };

  const skip = () => { if (busy) skipRef.current = true; };
  const stopAuto = () => { setAuto(false); autoRef.current = false; };

  const changeMode = (m) => {
    if (!busy && !pending) { setMode(m); resetStage(m.gates); setStats({ tries: 0, wins: 0 }); }
  };

  const spend = stats.tries * PRICE;
  const auraTier = aura ? TIERS[aura] : null;

  return (
    <div className="root">
      <style>{CSS}</style>

      {/* ヘッダ */}
      <header className="hd">
        <div className="hd-title">宝箱粉砕<span>抽選演出デモ(擬似体験)</span></div>
        <button className={"mini-btn" + (mute ? " on" : "")} onClick={() => setMute(!mute)}>{mute ? "♪OFF" : "♪ON"}</button>
      </header>

      {/* モードタブ */}
      <nav className="tabs">
        {MODES.map((m) => (
          <button key={m.id} disabled={busy || !!pending}
            className={"tab" + (mode.id === m.id ? " active" : "")}
            onClick={() => changeMode(m)}>
            <span className="tab-name">{m.name}</span>
            <span className="tab-odds">{m.odds}<b className="tab-boost">実{m.real}</b></span>
          </button>
        ))}
      </nav>

      {/* カウンター */}
      <div className="counters">
        <div className="ct"><em>{stats.tries.toLocaleString()}</em>回挑戦</div>
        <div className="ct"><em>¥{spend.toLocaleString()}</em><span className="ct-note">1口{PRICE}円換算</span></div>
      </div>

      {/* ステージ */}
      <div className={"stage" + (fx.shake ? " shake" : "") + (fast ? " fast" : "")}>
        <div className="sky">
          {[...Array(14)].map((_, i) => <i key={i} className="star" style={{ left: (i * 7.3 + 3) % 100 + "%", top: (i * 13.7) % 55 + "%", animationDelay: i * 0.4 + "s" }} />)}
        </div>
        <div className="ground" />

        {/* 進行ドット(宝箱) */}
        <div className="dots">
          {progress.map((s, i) => (
            <span key={i} className={"dot d-" + s}>
              <i className="dot-box" style={{ background: `linear-gradient(180deg, ${CHEST_MAT[seq[i]].hi}, ${CHEST_MAT[seq[i]].mid} 60%, ${CHEST_MAT[seq[i]].lo})` }} />
              <b>{i + 1}</b>
            </span>
          ))}
        </div>

        {/* オーラ表示 */}
        {auraTier && (
          <div className={"aura-label" + (auraFlicker ? " flick" : "") + (aura === "rainbow" ? " rb-text" : "")}
            style={aura !== "rainbow" ? { color: auraTier.text, borderColor: auraTier.text } : {}}>
            期待度 {auraTier.label}
          </div>
        )}

        {/* 宝箱 */}
        {gateNo > 0 && (
          <div className="gate-wrap" key={mode.id + "-" + gateNo}>
            <Chest status={gateStatus} material={seq[gateNo - 1] || "wood"} />
          </div>
        )}

        {/* 破壊バースト */}
        {burst && (
          <div className="burst">
            {[...Array(14)].map((_, i) => {
              const a = (i / 14) * Math.PI * 2;
              const d = 84 + (i % 3) * 36;
              return <i key={i} style={{ "--dx": Math.cos(a) * d + "px", "--dy": Math.sin(a) * d - 36 + "px", background: i % 2 ? "#ffc63a" : "#ff6a4d", animationDelay: (i % 4) * 0.02 + "s" }} />;
            })}
            <span className="bring" />
            <span className="bglow" />
          </div>
        )}
        {breakText && <div className="break-text">{breakText}</div>}

        {/* キャラ */}
        <div className={"char-wrap pose-" + charPose}>
          {aura && (
            <div className={"aura-ring" + (aura === "rainbow" ? " rb" : "") + (auraFlicker ? " flick" : "")}
              style={aura !== "rainbow" ? { background: `radial-gradient(circle, ${TIERS[aura].c}55 0%, ${TIERS[aura].c}22 45%, transparent 70%)` } : {}} />
          )}
          <img src={CHAR_IMG} alt="" className="char" draggable={false} />
        </div>

        {/* エフェクト */}
        {fx.clouds && (
          <div className="clouds">
            <i /><i /><i />
            <div className="clouds-txt">虹雲降臨</div>
          </div>
        )}
        {fx.flash && <div className="flash" />}
        {fx.dark && <div className="dark" />}

        {/* 結果 */}
        {result && (
          <div className={"result " + (result.win ? "r-win" : "r-lose")}>
            {result.win && <div className="rays" />}
            <div className="r-main">{result.text}</div>
            {result.prize && <div className="r-prize">{result.prize}</div>}
            <div className="r-sub">{result.sub}</div>
            {result.win && (
              <div className="coins">
                {[...Array(24)].map((_, i) => (
                  <i key={i} style={{ left: (i * 4.3 + 2) % 96 + "%", animationDelay: (i % 8) * 0.11 + "s" }} />
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* 操作 */}
      <div className="ctrl">
        <button className={"auto-btn" + (auto ? " on" : "")}
          onClick={() => {
            if (auto) { stopAuto(); return; }
            setAuto(true); autoRef.current = true;
            if (!busy) { if (pending) attempt(pending.next, pending.sc, pending.n); else newRun(); }
          }}>
          {auto ? "■ オート停止" : "▶ オート"}
        </button>
        <button className={"main-btn" + (pending ? ` next next-${seq[pending.next - 1]}` : "")} onClick={onMain} disabled={busy}>
          {busy ? "抽選中…" : pending ? `${CHEST_MAT[seq[pending.next - 1]].label}を叩く!` : result ? "もう一度挑む" : "宝箱に挑む"}
        </button>
        <button className="skip-btn" onClick={skip} disabled={!busy}>
          スキップ ≫
        </button>
      </div>

      <p className="foot">結果はボタン押下時に確定済み(演出は結果の見せ方のみ)。当選確率:{mode.odds}(本来の{mode.real}からデモ用に引き上げ)。当選するとカウンターはリセット。</p>
    </div>
  );
}

const CSS = `

/* カウンター */
.counters { width: 100%; max-width: 460px; display: flex; gap: 6px; margin-bottom: 10px; }

/* ステージ */
.stage {

}
.sky { position: absolute; inset: 0; }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #ffe9a3; opacity: .5; animation: tw 2.6s ease-in-out infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.pose-idle { animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

.pose-dash { transform: translateX(206px) rotate(7deg); }

.coins { position: absolute; inset: 0; overflow: hidden; }
.coins i {

/* 操作 */
.ctrl { width: 100%; max-width: 460px; display: flex; gap: 8px; margin-top: 12px; align-items: stretch; }

  flex: 2.2; font-family: 'RocknRoll One', sans-serif; font-size: 20px; letter-spacing: 3px;

}

}

.auto-btn, .skip-btn {
